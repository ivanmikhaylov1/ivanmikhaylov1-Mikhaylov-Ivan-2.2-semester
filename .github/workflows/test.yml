name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      scylla:
        image: scylladb/scylla:5.2.0
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          sudo pip3 install cqlsh

      - name: Wait for ScyllaDB to be ready
        run: |
          max_attempts=20
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if cqlsh --connect-timeout=10 127.0.0.1 9042 -e "describe keyspaces" > /dev/null 2>&1; then
              break
            fi
            attempt=$((attempt+1))
            sleep 15
          done
          
          if [ $attempt -eq $max_attempts ]; then
            exit 1
          fi

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Run tests
        run: mvn test
        env:
          SPRING_PROFILES_ACTIVE: test
