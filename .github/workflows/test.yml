name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      scylla:
        image: scylladb/scylla:5.2.0
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --ulimit memlock=-1
          --ulimit nofile=100000
        env:
          SCYLLA_DEVELOPER_MODE: "1"
          SCYLLA_SMP: "1"
          SCYLLA_MEMORY: "750M"
          SCYLLA_OVERPROVISIONED: "1"

      kafka:
        image: bitnami/kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_NODE_ID: 0
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: true
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          ALLOW_PLAINTEXT_LISTENER: yes
        options: >-
          --health-cmd "kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip kafka
          sudo pip3 install cqlsh

      - name: Wait for ScyllaDB to be ready and create schema
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if cqlsh --connect-timeout=10 127.0.0.1 9042 -e "describe keyspaces" > /dev/null 2>&1; then
              cqlsh 127.0.0.1 9042 -e "CREATE KEYSPACE IF NOT EXISTS user_audit WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
              cqlsh 127.0.0.1 9042 -e "CREATE TABLE IF NOT EXISTS user_audit.outbox (id uuid PRIMARY KEY, value text);"
              cqlsh 127.0.0.1 9042 -e "CREATE TABLE IF NOT EXISTS user_audit.audit_logs (id uuid PRIMARY KEY, user_id text, entity_id text, entity_type text, action text, timestamp timestamp, details text);"
              break
            fi
            attempt=$((attempt+1))
            sleep 20
          done
          
          if [ $attempt -eq $max_attempts ]; then
            exit 1
          fi

      - name: Wait for Kafka to be ready
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              break
            fi
            attempt=$((attempt+1))
            sleep 10
          done
          
          if [ $attempt -eq $max_attempts ]; then
            exit 1
          fi

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Run tests
        run: mvn test
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATA_CASSANDRA_LOCAL_DATACENTER: datacenter1
          SPRING_DATA_CASSANDRA_CONTACT_POINTS: localhost
          SPRING_DATA_CASSANDRA_PORT: 9042
          SPRING_DATA_CASSANDRA_KEYSPACE: user_audit
          SPRING_DATA_CASSANDRA_SCHEMA_ACTION: CREATE_IF_NOT_EXISTS
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: localhost:9092
